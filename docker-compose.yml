name: fireaway

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      [edge,internal]

  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   ports:
  #     - "127.0.0.1:8080:80"
  #   depends_on:
  #     - postgres

  backend:
    cap_add:
      [SYS_PTRACE]
    build:
      context: .
      dockerfile: app/backend/Dockerfile
      target: dev
    container_name: python-backend
    working_dir: /app
    env_file:
      [.env]
    environment:
      - VALKEY_HOST=valkey
      - MINIO_ENDPOINT=minio:9000
      - PYTHONPATH=/app
      - VALKEY_PORT=6379
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./app/__init__.py:/app/app/__init__.py:ro,Z
      - ./app/backend:/app/app/backend:Z
      - ./app/artifact_store:/app/app/artifact_store:Z
    ports:
      - "127.0.0.1:8000:8000"
    command: [ "uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      [edge,internal]

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      target: dev
    container_name: next-frontend
    restart: unless-stopped
    env_file:
      [.env]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./app/frontend:/app:z
      - frontend_node_modules:/app/node_modules:Z
    expose:
      - "3000"
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    command: ["sh", "-c", "yarn install --prefer-offline --frozen-lockfile && yarn dev -H 0.0.0.0"]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      [edge,internal]

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    env_file:
      [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DRIVE_MIN_FREE_DISK: "500MB"
      MINIO_STORAGE_REST_MIN_FREE_DISK: "500MB"
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  valkey:
    image: valkey/valkey:latest
    container_name: valkey-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      [internal]

  reseed:
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
      target: dev
    profiles: [ "tools" ]
    env_file:
      [.env]
    environment:
      - PYTHONPATH=/app
      - SEED_DEFAULT_PASSWORD=${SEED_DEFAULT_PASSWORD}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    volumes:
      - ./app/__init__.py:/app/app/__init__.py:ro,Z
      - ./app/backend:/app/app/backend:Z
      - ./app/artifact_store:/app/app/artifact_store:Z
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "python", "-m", "app.backend.seed", "--reseed" ]
    networks:
      [internal]

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  
volumes:
  pgdata:
  miniodata:
  valkeydata:
  frontend_node_modules:

