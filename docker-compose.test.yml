services:
  test-db:

    image: postgis/postgis:15-3.3

    container_name: fireaway_test_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_fire_db

    ports: 
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_fire_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped

  test-minio:
    image: minio/minio:latest
    container_name: fireaway_test_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: miniosupersecretpassword
    command: server /data --console-address ":9001"
    ports: 
      - "9002:9000"
      - "9003:9001"
    
    restart: unless-stopped

  backend-test:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
      target: test
    environment:
      PYTHONPATH: /
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/test_fire_db
      MINIO_ENDPOINT: test-minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: miniosupersecretpassword
    volumes:
      - .:/app/Z
    depends_on:
      test-db:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    command: ["pytest", "app/backend/testing"]